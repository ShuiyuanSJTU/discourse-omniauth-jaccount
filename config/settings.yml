discourse-omniauth-jaccount:
  jaccount_auth_enabled:
    default: true
    client: true
  jaccount_auth_debug_mode:
    default: false
    client: false
  jaccount_auth_block_types: 
    default: ""
    type: list
    client: false
  jaccount_auth_types_must_have_code: 
    default: ""
    type: list
    client: false
  jaccount_auth_check_all_identities: 
    default: true
    client: false
  jaccount_auth_block_code_regex:
    default: ""
    client: false
  jaccount_display_account_type:
    default: false
    client: false
  jaccount_dormant_alumni_enabled:
    default: false
    client: false
  jaccount_dormant_alumni_inactive_days:
    default: 180
    min: 1
    client: false
    depends_on:
      - jaccount_dormant_alumni_enabled
    depends_behavior: hidden
    dependent_setting_display: inline
